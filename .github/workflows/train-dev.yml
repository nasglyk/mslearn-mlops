name: Train model in dev

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - 'src/train-model-parameters.py'
      - 'src/job.yml'

permissions:
  contents: read
  pull-requests: write

jobs:
  train-dev:
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Install Azure ML CLI
        run: |
          az extension add -n ml -y

      - name: Detect Azure ML workspace
        id: detect
        run: |
          RG_NAME=$(az group list --query "[?starts_with(name,'rg-ai300-l')].name | [0]" -o tsv)
          if [ -z "$RG_NAME" ]; then
            echo "No resource group starting with rg-ai300-l found." >&2
            exit 1
          fi

          WS_NAME=$(az ml workspace list --resource-group "$RG_NAME" --query "[?starts_with(name,'mlw-ai300-l')].name | [0]" -o tsv)
          if [ -z "$WS_NAME" ]; then
            echo "No workspace starting with mlw-ai300-l found in $RG_NAME." >&2
            exit 1
          fi

          az configure --defaults group="$RG_NAME" workspace="$WS_NAME"

          echo "resource_group=$RG_NAME" >> "$GITHUB_OUTPUT"
          echo "workspace=$WS_NAME" >> "$GITHUB_OUTPUT"

      - name: Run training job in dev
        id: train
        env:
          AZURE_CORE_COLLECT_TELEMETRY: "false"
        run: |
          JOB_NAME="diabetes-train-dev-${{ github.run_id }}"
          echo "Running Azure ML job: $JOB_NAME"
          az ml job create \
            -f src/job.yml \
            --name "$JOB_NAME" \
            --set inputs.training_data.path=azureml:diabetes-dev-folder@latest \
            --query name -o tsv

          echo "job_name=$JOB_NAME" >> "$GITHUB_OUTPUT"

      - name: Wait for dev training job to complete
        run: |
          JOB_NAME="${{ steps.train.outputs.job_name }}"
          echo "Waiting for job $JOB_NAME to complete..."
          
          STATUS="Running"
          while [[ "$STATUS" != "Completed" && "$STATUS" != "Failed" && "$STATUS" != "Canceled" ]]; do
            sleep 30
            STATUS=$(az ml job show --name "$JOB_NAME" --query status -o tsv)
            echo "Current job status: $STATUS"
          done
          
          if [ "$STATUS" != "Completed" ]; then
            echo "Job did not complete successfully. Final status: $STATUS"
            exit 1
          fi

      - name: Download dev training logs
        run: |
          JOB_NAME="${{ steps.train.outputs.job_name }}"
          mkdir -p downloaded-logs
          # Download only the system logs and user outputs, skipping large model artifacts
          az ml job download --name "$JOB_NAME" --download-path downloaded-logs

      - name: Extract dev metrics from logs
        id: parse-metrics
        run: |
          # Azure ML automatically saves your Python script's console output to std_log.txt
          LOG_FILE=$(find downloaded-logs -name std_log.txt | head -n 1)
          
          if [ -z "$LOG_FILE" ]; then
            echo "No std_log.txt found to parse metrics." >&2
            exit 1
          fi

          ACC=$(grep -o "Accuracy: .*" "$LOG_FILE" | tail -n 1 | awk '{print $2}') || true
          AUC=$(grep -o "AUC: .*" "$LOG_FILE" | tail -n 1 | awk '{print $2}') || true

          echo "Dev accuracy: $ACC"
          echo "Dev AUC: $AUC"

          echo "dev_accuracy=$ACC" >> "$GITHUB_OUTPUT"
          echo "dev_auc=$AUC" >> "$GITHUB_OUTPUT"

      - name: Comment dev metrics on pull request
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const acc = '${{ steps.parse-metrics.outputs.dev_accuracy }}';
            const auc = '${{ steps.parse-metrics.outputs.dev_auc }}';

            const prNumber = context.payload.pull_request.number;

            let body = '✅ Dev training workflow completed.';
            if (acc || auc) {
              body += '\n\n**Dev evaluation metrics**';
              if (acc) body += `\n- Accuracy: ${acc}`;
              if (auc) body += `\n- AUC: ${auc}`;
            } else {
              body += '\n\nMetrics could not be parsed from logs. Check the Azure Machine Learning job run for details.';
            }

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
              body,
            });
